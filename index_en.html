<!DOCTYPE html>
<html lang="en">
<head>
<title>Korean Forensic Experts & Consulting</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@300..800&display=swap" rel="stylesheet">

</head>
<body class="en">


<div id="sidenav" class="sidenav">
<script>
  fetch('sidenav_en.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidenav').innerHTML = data;

      // 현재 페이지에 해당하는 링크에 스타일 추가
      let links = document.querySelectorAll(".sidenav a");
      links.forEach(link => {
        if (link.href === window.location.href) {
          link.style.color = "teal";  // 선택된 링크 강조
          link.style.fontWeight = "bold"; 
        }
      });
    });
</script>
</div>
<div class="content">
<div class="content-box">
<iframe src="english.pdf" width="100%" height="600px"></iframe>
</div>
</div>
</body>
</html>
